name: Claude review with token pool
description: >-
  Runs a Claude review with the primary token from the pool and, when that run fails or
  returns no structured verdict, once more with the fallback token (ADR 0008). It only
  returns the verdict; the calling workflow decides pass/fail, so a blocking finding
  never triggers a retry. Needs the repository checked out (scripts/review-pool.mjs).

inputs:
  prompt:
    description: Review prompt
    required: true
  primary:
    description: Primary token name from scripts/review-pool.mjs plan (maintainer | ziyi)
    required: true
  fallback:
    description: Fallback token name, or empty for none
    required: false
    default: ""
  maintainer_token:
    description: secrets.CLAUDE_CODE_OAUTH_TOKEN
    required: true
  ziyi_token:
    description: secrets.CLAUDE_CODE_OAUTH_TOKEN_ZIYI
    required: false
    default: ""
  label:
    description: Check name used in log messages
    required: true

outputs:
  verdict:
    description: Compact JSON {blocking, summary}, or empty when neither run returned one
    value: ${{ steps.result.outputs.verdict }}
  token:
    description: Name of the token whose verdict was returned
    value: ${{ steps.result.outputs.token }}

runs:
  using: composite
  steps:
    - name: Review (primary token)
      id: primary
      continue-on-error: true
      uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
      with:
        claude_code_oauth_token: ${{ inputs.primary == 'ziyi' && inputs.ziyi_token || inputs.maintainer_token }}
        use_sticky_comment: true
        prompt: ${{ inputs.prompt }}
        claude_args: |
          --model claude-sonnet-5-5
          --max-turns 25
          --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*)"
          --json-schema '{"type":"object","properties":{"blocking":{"type":"boolean"},"summary":{"type":"string"}},"required":["blocking","summary"]}'

    # Outputs travel through env, never interpolated into the script.
    - name: Decide whether to retry with the fallback token
      id: decide
      shell: bash
      env:
        OUTCOME: ${{ steps.primary.outcome }}
        VERDICT: ${{ steps.primary.outputs.structured_output }}
        SKIPPED: ${{ steps.primary.outputs.skipped_due_to_workflow_validation_mismatch }}
        FALLBACK: ${{ inputs.fallback }}
      run: node "$GITHUB_WORKSPACE/scripts/review-pool.mjs" retry

    - name: Review (fallback token)
      id: fallback
      if: steps.decide.outputs.retry == 'true'
      continue-on-error: true
      uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
      with:
        claude_code_oauth_token: ${{ inputs.fallback == 'ziyi' && inputs.ziyi_token || inputs.maintainer_token }}
        use_sticky_comment: true
        prompt: ${{ inputs.prompt }}
        claude_args: |
          --model claude-sonnet-5-5
          --max-turns 25
          --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*)"
          --json-schema '{"type":"object","properties":{"blocking":{"type":"boolean"},"summary":{"type":"string"}},"required":["blocking","summary"]}'

    - name: Collect verdict
      id: result
      shell: bash
      env:
        LABEL: ${{ inputs.label }}
        PRIMARY: ${{ inputs.primary }}
        FALLBACK: ${{ inputs.fallback }}
        PRIMARY_VERDICT: ${{ steps.primary.outputs.structured_output }}
        FALLBACK_VERDICT: ${{ steps.fallback.outputs.structured_output }}
        FALLBACK_RAN: ${{ steps.decide.outputs.retry }}
      run: node "$GITHUB_WORKSPACE/scripts/review-pool.mjs" result
