name: CI

# Lint, typecheck and unit tests for client and server on every PR, the same checks
# the pre-commit hook runs (lefthook.yml). megaweaving-cicd.yaml repeats them before deploy.
# No `paths` filter: "Lint, typecheck, test" is a required check, and a required check
# that never reports blocks the PR.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix client
          npm ci --prefix server

      # Fails on high/critical advisories in production dependencies
      - name: Audit dependencies
        run: |
          npm audit --prefix client --omit=dev --audit-level=high
          npm audit --prefix server --omit=dev --audit-level=high

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Unit tests
        run: make test
