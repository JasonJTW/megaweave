name: CI

# Lint, typecheck and unit tests for client and server on every PR, the same checks
# the pre-commit hook runs (lefthook.yml). megaweaving-cicd.yaml repeats them before deploy.
# No `paths` filter: "Lint, typecheck, test" is a required check, and a required check
# that never reports blocks the PR.
# `edited` re-runs the job when a PR body changes, so a corrected `Model:` line
# (agent PR check below) turns the check green without a new commit.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

# pull-requests: read lists an agent PR's commits (scripts/check-agent-pr.mjs)
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # server 的 *.db.test.ts（npm run test:db）用 schema.sql 在這裡建測試庫
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix client
          npm ci --prefix server

      # Fails on high/critical advisories in production dependencies
      - name: Audit dependencies
        run: |
          npm audit --prefix client --omit=dev --audit-level=high
          npm audit --prefix server --omit=dev --audit-level=high

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Unit tests
        run: make test
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3306"
          TEST_DB_PASSWORD: test-root

      # The contribute skill's issue picking and claiming (docs/agents/contributing.md)
      - name: Contributor agent script tests
        run: node --test .agents/skills/contribute/scripts/*.test.mjs

      # Agent PRs (head branch agent/...) must declare an allowed model in the body and
      # in every commit's trailer (scripts/check-agent-pr.mjs). The body travels through
      # env, never interpolated into the script.
      - name: Agent PR model declaration
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-agent-pr.mjs
