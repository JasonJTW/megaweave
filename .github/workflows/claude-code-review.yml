name: Claude Code Review

# No workflow-level `paths` filter, so this can be a required status check: a required
# check that never reports blocks the PR, so irrelevant PRs pass in-job instead.
# Token pool, retry and verdict cache: ADR 0008, ADR 0006 amendment,
# docs/agents/review-workflows.md. Logic lives in scripts/review-pool.mjs.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Code Review
    # Fork PRs never receive secrets; a skipped job reports success.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # write: only used when this workflow differs from main (see .github/actions/claude-review)
      pull-requests: write
      issues: read
      id-token: write
    env:
      # Bump when the prompt below changes, so cached verdicts expire.
      PROMPT_VERSION: "1"

    steps:
      # Full history: the cache key hashes the PR's diff against its merge-base.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan review
        id: plan
        env:
          KIND: code
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_MAINTAINER_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_ZIYI_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_ZIYI != '' }}
          WORKFLOW_FILE: .github/workflows/claude-code-review.yml
        run: node scripts/review-pool.mjs plan

      - name: Look up cached verdict
        id: cache
        if: steps.plan.outputs.relevant == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .review-verdict
          key: ${{ steps.plan.outputs.cache_key }}

      - name: Run Claude Code Review
        id: review
        if: steps.plan.outputs.relevant == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/claude-review
        with:
          label: Claude Code Review
          primary: ${{ steps.plan.outputs.primary }}
          fallback: ${{ steps.plan.outputs.fallback }}
          maintainer_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ziyi_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_ZIYI }}
          github_token: ${{ steps.plan.outputs.workflow_changed == 'true' && github.token || '' }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR against docs/agents/code-review.md.
            Batch tool calls: read every file you need in one turn, then post all inline comments in one turn.
            Done when every changed file is checked against every standard and each finding is posted as an inline comment.
            Return blocking=true when any finding is blocking as defined in docs/agents/code-review.md, with a one-line summary of the blocking findings.

      # Only this step decides pass/fail. The verdict travels through env.
      - name: Enforce verdict
        id: enforce
        if: steps.plan.outputs.relevant == 'true'
        env:
          LABEL: Claude Code Review
          VERDICT: ${{ steps.review.outputs.verdict }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: node scripts/review-pool.mjs enforce

      # Only non-blocking verdicts reach the cache.
      - name: Cache verdict
        if: steps.enforce.outputs.cacheable == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .review-verdict
          key: ${{ steps.plan.outputs.cache_key }}
