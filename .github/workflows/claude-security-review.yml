name: Claude Security Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "server/src/**"
      - "client/middleware.ts"
      - "client/app/api/**"
      - ".github/workflows/**"

concurrency:
  group: claude-security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-security-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Security Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Security-review the changed lines of this PR. Trace each finding from untrusted input to impact, and cite file:line.
            Check every item:
            1. SQL: every value reaching a query is a bound parameter.
            2. Authorization: every changed route verifies the caller owns or may access the resource; invisible posts return 404 (see ADR 0003).
            3. Input: payloads are parsed with Zod before use.
            4. Webhooks and callbacks (ECPay, Lalamove): signature or auth is verified before any state change; replayed requests leave state unchanged.
            5. Secrets and errors: keys stay in env; 5xx responses carry no internals.
            6. Workflows: secrets and PR-controlled text never reach a shell or `run:` step.
            Done when all six items are checked; post only confirmed exploitable issues as inline comments, and post nothing when none exist.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 10
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*)"
