name: DB migrations

# ADR 0009: base schema.sql + the migrations a PR adds must equal the PR's schema.sql,
# destructive statements need the `migration-approved` label (added by an admin), and schema changes need
# `needs-migration`. The logic lives in scripts/check-db-migrations.mjs (runs locally too).
# No `paths` filter: "DB migrations" is a required check, and a required check that
# never reports blocks the PR, so PRs without server/db/ changes pass in-job.
# labeled/unlabeled re-run the check, so adding a label re-evaluates it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

# issues/pull-requests: read the PR's label events, so `migration-approved` counts only
# when a repository admin added it (scripts/check-db-migrations.mjs verifyApproval).
permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: db-migrations-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: DB migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Unit-test the check
        run: node --test scripts/*.test.mjs
        env:
          # Also runs scripts/dbmate.test.mjs (dbmate, the deploy script, baseline and backup) in Docker
          DB_SCRIPTS_IT: "1"

      # The script starts a throwaway mysql:8.0 container with the E2E flags
      # (docker-compose.e2e.yml); a `services:` container cannot take mysqld flags.
      # Labels travel through env as JSON, never interpolated into the script.
      - name: Check migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-db-migrations.mjs
