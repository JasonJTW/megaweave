name: E2E

# Runs the Playwright suite against the isolated E2E stack (docs/e2e.md).
# Separate from megaweaving-cicd.yaml: this never touches EC2 or production.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix client
          npm ci --prefix server

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium webkit

      # Self-signed certificate for the API (server/cert) and the client HTTPS proxy (client/certificates)
      - name: Generate localhost certificate
        run: |
          mkdir -p server/cert client/certificates
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout server/cert/localhost.key -out server/cert/localhost.crt
          cp server/cert/localhost.key client/certificates/localhost-key.pem
          cp server/cert/localhost.crt client/certificates/localhost.pem

      - name: Start E2E stack
        run: make e2e-up

      - name: Run Playwright
        working-directory: client
        run: npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            client/playwright-report/
            client/test-results/
          retention-days: 7

      - name: Stop E2E stack
        if: always()
        run: make e2e-down
