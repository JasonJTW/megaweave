name: Megaweave CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. Detect Changes（GitHub Cloud Runner — 輕量、不消耗 EC2）
  # ─────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      server-changed: ${{ steps.changes.outputs.server }}
      client-changed: ${{ steps.changes.outputs.client }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            server:
              - 'server/**'
              - 'docker-compose.yml'
            client:
              - 'client/**'
              - 'docker-compose.yml'

  # ─────────────────────────────────────────────────────────
  # 2. EC2 Pre-Deploy Cleanup（與 Build 平行執行，節省總時間）
  # ─────────────────────────────────────────────────────────
  pre-deploy-cleanup:
    name: Pre-Deploy Cleanup (EC2)
    needs: detect-changes
    if: >
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.server-changed == 'true' ||
        needs.detect-changes.outputs.client-changed == 'true'
      )
    runs-on: self-hosted
    steps:
      - name: Check disk space & Prune Docker
        run: |
          echo "📊 當前磁碟使用："
          df -h /
          USAGE=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
          echo "磁碟使用率: ${USAGE}%"

          echo "🧹 清理 24 小時前的 Docker 鏡像..."
          docker image prune -af --filter "until=24h" || true

          if [ $USAGE -gt 85 ]; then
            echo "⚠️  磁碟使用率超過 85%，開始深度清理..."
            docker system prune -af --volumes || true
            sudo journalctl --vacuum-time=3d 2>/dev/null || true
            sudo apt-get clean 2>/dev/null || true
            echo "✅ 深度清理完成"
            df -h /
          else
            echo "✅ 磁碟空間充足"
          fi

      - name: Check memory
        run: |
          echo "💾 當前記憶體使用："
          free -h

          SWAP_TOTAL=$(free | grep Swap | awk '{print $2}')
          if [ "$SWAP_TOTAL" != "0" ]; then
            SWAP_USAGE=$(free | grep Swap | awk '{if($2>0) print int(($3/$2)*100); else print 0}')
            if [ $SWAP_USAGE -gt 30 ]; then
              echo "⚠️ Swap 使用率: ${SWAP_USAGE}%，清理快取..."
              sudo sync
              sudo sysctl -w vm.drop_caches=3
              echo "✅ 快取已清理"
              free -h
            fi
          fi

  # ─────────────────────────────────────────────────────────
  # 3a. Build Backend（GitHub Cloud Runner — 高效能機器 Build）
  # ─────────────────────────────────────────────────────────
  build-backend:
    name: Build & Push Backend Image
    needs: detect-changes
    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.server-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          dockerfile: ./server/Dockerfile
          push: true
          tags: ghcr.io/jasonjtw/megaweaving-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────
  # 3b. Build Frontend（GitHub Cloud Runner — 高效能機器 Build）
  # ─────────────────────────────────────────────────────────
  build-frontend:
    name: Build & Push Frontend Image
    needs: detect-changes
    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.client-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          dockerfile: ./client/Dockerfile
          push: true
          tags: ghcr.io/jasonjtw/megaweaving-frontend:latest
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────
  # 4a. Deploy Backend（EC2 — 只做 pull + up，幾秒完成）
  # ─────────────────────────────────────────────────────────
  deploy-server:
    name: Deploy Backend (Docker)
    needs: [detect-changes, pre-deploy-cleanup, build-backend]
    if: needs.build-backend.result == 'success'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare .env.production files
        run: |
          # docker compose 解析整個 config 時，會讀取所有服務的 env_file
          # 即使只啟動 backend，也需要 client/.env.production 存在，反之亦然
          mkdir -p server client

          if [ -f ~/megaweave/server/.env.production ]; then
            cp ~/megaweave/server/.env.production server/.env.production
            echo "✅ server/.env.production copied"
          else
            echo "❌ server/.env.production not found at ~/megaweave/server/"
            exit 1
          fi

          if [ -f ~/megaweave/client/.env.production ]; then
            cp ~/megaweave/client/.env.production client/.env.production
            echo "✅ client/.env.production copied"
          else
            echo "❌ client/.env.production not found at ~/megaweave/client/"
            exit 1
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop old systemd backend service if exists
        run: |
          if sudo systemctl is-active --quiet megaweave-be.service 2>/dev/null; then
            echo "🛑 Stopping legacy systemd backend service..."
            sudo systemctl stop megaweave-be.service
            sudo systemctl disable megaweave-be.service || true
          else
            echo "✅ No legacy systemd backend service running"
          fi

      - name: Pull and deploy backend container
        run: |
          echo "⬇️ Pulling latest backend image from GHCR..."
          docker compose pull backend
          echo "🚀 Starting backend container..."
          docker compose up -d backend

      - name: Verify backend container
        run: |
          sleep 5
          if [ "$(docker inspect -f '{{.State.Running}}' megaweave-backend 2>/dev/null)" = "true" ]; then
            echo "✅ Backend container is running successfully"
            docker compose ps backend
          else
            echo "❌ Backend container failed to start"
            docker logs megaweave-backend --tail 50
            exit 1
          fi

  # ─────────────────────────────────────────────────────────
  # 4b. Deploy Frontend（EC2 — 只做 pull + up，幾秒完成）
  # ─────────────────────────────────────────────────────────
  deploy-client:
    name: Deploy Frontend (Docker)
    needs: [detect-changes, pre-deploy-cleanup, build-frontend]
    if: needs.build-frontend.result == 'success'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare .env.production files
        run: |
          # docker compose 解析整個 config 時，會讀取所有服務的 env_file
          # 即使只啟動 frontend，也需要 server/.env.production 存在，反之亦然
          mkdir -p server client

          if [ -f ~/megaweave/server/.env.production ]; then
            cp ~/megaweave/server/.env.production server/.env.production
            echo "✅ server/.env.production copied"
          else
            echo "❌ server/.env.production not found at ~/megaweave/server/"
            exit 1
          fi

          if [ -f ~/megaweave/client/.env.production ]; then
            cp ~/megaweave/client/.env.production client/.env.production
            echo "✅ client/.env.production copied"
          else
            echo "❌ client/.env.production not found at ~/megaweave/client/"
            exit 1
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop old systemd frontend service if exists
        run: |
          if sudo systemctl is-active --quiet megaweave-fe.service 2>/dev/null; then
            echo "🛑 Stopping legacy systemd frontend service..."
            sudo systemctl stop megaweave-fe.service
            sudo systemctl disable megaweave-fe.service || true
          else
            echo "✅ No legacy systemd frontend service running"
          fi

      - name: Pull and deploy frontend container
        run: |
          echo "⬇️ Pulling latest frontend image from GHCR..."
          docker compose pull frontend
          echo "🚀 Starting frontend container..."
          docker compose up -d frontend

      - name: Verify frontend container
        run: |
          sleep 5
          if [ "$(docker inspect -f '{{.State.Running}}' megaweave-frontend 2>/dev/null)" = "true" ]; then
            echo "✅ Frontend container is running successfully"
            docker compose ps frontend
          else
            echo "❌ Frontend container failed to start"
            docker logs megaweave-frontend --tail 50
            exit 1
          fi

  # ─────────────────────────────────────────────────────────
  # 5. Post-Deploy Cleanup
  # ─────────────────────────────────────────────────────────
  post-deploy-cleanup:
    name: Post-Deploy Cleanup
    needs: [deploy-server, deploy-client]
    if: >
      always() && (
        needs.deploy-server.result != 'skipped' ||
        needs.deploy-client.result != 'skipped'
      )
    runs-on: self-hosted
    steps:
      - name: Clean up dangling docker images
        run: |
          echo "🧹 清理 dangling Docker 鏡像..."
          docker image prune -f || true
          echo "✅ 清理完成"

      - name: Final disk check
        run: |
          echo "📊 最終磁碟狀態："
          df -h /
          echo ""
          echo "💾 記憶體狀態："
          free -h

  # ─────────────────────────────────────────────────────────
  # 6. Summary / Failure Report
  # ─────────────────────────────────────────────────────────
  deployment-summary:
    name: Deployment Summary
    needs: [detect-changes, deploy-server, deploy-client, post-deploy-cleanup]
    if: >
      always() && (
        needs.deploy-server.result == 'success' ||
        needs.deploy-client.result == 'success'
      )
    runs-on: self-hosted
    steps:
      - name: Print deployment summary
        run: |
          echo "🎯 === DEPLOYMENT SUMMARY ==="
          echo "📅 Time: $(date)"
          echo "🔍 Changes detected:"
          echo "  - Server: ${{ needs.detect-changes.outputs.server-changed }}"
          echo "  - Client: ${{ needs.detect-changes.outputs.client-changed }}"
          echo ""
          echo "🚀 Deployment results:"
          if [ "${{ needs.deploy-server.result }}" == "success" ]; then
            echo "  - ✅ Backend Container: deployed"
          else
            echo "  - Backend: skipped (no changes)"
          fi
          if [ "${{ needs.deploy-client.result }}" == "success" ]; then
            echo "  - ✅ Frontend Container: deployed"
          else
            echo "  - Frontend: skipped (no changes)"
          fi
          echo ""
          echo "📊 System status:"
          df -h / | tail -1
          echo ""
          echo "🎉 Deployment completed successfully!"

  deployment-failure:
    name: Deployment Failed
    needs: [detect-changes, deploy-server, deploy-client, post-deploy-cleanup]
    if: >
      always() && (
        needs.deploy-server.result == 'failure' ||
        needs.deploy-client.result == 'failure'
      )
    runs-on: self-hosted
    steps:
      - name: Print failure summary
        run: |
          echo "❌ === DEPLOYMENT FAILED ==="
          echo "📅 Time: $(date)"
          echo "🔍 Changes detected:"
          echo "  - Server: ${{ needs.detect-changes.outputs.server-changed }}"
          echo "  - Client: ${{ needs.detect-changes.outputs.client-changed }}"
          echo ""
          echo "💥 Failed jobs:"
          if [ "${{ needs.deploy-server.result }}" == "failure" ]; then
            echo "  - ❌ Backend container deployment failed"
          fi
          if [ "${{ needs.deploy-client.result }}" == "failure" ]; then
            echo "  - ❌ Frontend container deployment failed"
          fi
          echo ""
          echo "📊 Current system status:"
          df -h /
          free -h
          echo ""
          echo "🔧 Check the job logs above or run: docker logs <container_name> --tail 100"
