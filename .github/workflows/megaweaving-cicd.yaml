name: Megaweave CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: self-hosted
    outputs:
      server-changed: ${{ steps.changes.outputs.server }}
      client-changed: ${{ steps.changes.outputs.client }}
      any-changed: ${{ steps.changes.outputs.server == 'true' || steps.changes.outputs.client == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            server:
              - 'server/**'
              - 'docker-compose.yml'
            client:
              - 'client/**'
              - 'docker-compose.yml'

  pre-deploy-cleanup:
    name: Pre-Deploy Cleanup
    needs: detect-changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.any-changed == 'true')
    runs-on: self-hosted
    steps:
      - name: Check disk space & Prune Docker
        run: |
          echo "📊 當前磁碟使用："
          df -h /
          USAGE=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
          echo "磁碟使用率: ${USAGE}%"

          # 清理懸空及未使用的 Docker 鏡像與層
          echo "🧹 清理 Docker 快取鏡像..."
          docker image prune -af --filter "until=24h" || true

          if [ $USAGE -gt 85 ]; then
            echo "⚠️  磁碟使用率超過 85%，開始深度清理..."
            
            # 清理 Docker 系統
            docker system prune -af --volumes || true
            
            # 清理 npm 快取
            npm cache clean --force 2>/dev/null || true
            
            # 清理系統日誌
            sudo journalctl --vacuum-time=3d 2>/dev/null || true
            
            # 清理 APT
            sudo apt-get clean 2>/dev/null || true
            
            # 清理舊備份（只保留最新 1 個）
            cd ~
            ls -dt megaweave.backup.* 2>/dev/null | tail -n +2 | xargs -r rm -rf
            
            # 清理 GitHub Actions 工作目錄
            find ~/github-runner/actions-runner/_work -mindepth 1 -maxdepth 1 -type d -mtime +3 -exec rm -rf {} \; 2>/dev/null || true
            
            # 清理臨時文件
            sudo rm -rf /tmp/npm-* 2>/dev/null || true
            
            echo "✅ 深度清理完成"
            df -h /
          else
            echo "✅ 磁碟空間充足"
          fi

      - name: Check memory
        run: |
          echo "💾 當前記憶體使用："
          free -h

          SWAP_TOTAL=$(free | grep Swap | awk '{print $2}')
          if [ "$SWAP_TOTAL" != "0" ]; then
            SWAP_USAGE=$(free | grep Swap | awk '{if($2>0) print int(($3/$2)*100); else print 0}')
            if [ $SWAP_USAGE -gt 30 ]; then
              echo "⚠️ Swap 使用率: ${SWAP_USAGE}%，清理快取..."
              sudo sync
              sudo sysctl -w vm.drop_caches=3
              echo "✅ 快取已清理"
              free -h
            fi
          fi

  create-backup:
    name: Create Backup
    needs: [detect-changes, pre-deploy-cleanup]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.any-changed == 'true')
    runs-on: self-hosted
    outputs:
      backup-created: ${{ steps.backup.outputs.backup-created }}
      backup-path: ${{ steps.backup.outputs.backup-path }}
    steps:
      - name: Create production backup
        id: backup
        run: |
          if [ -d ~/megaweave ]; then
            BACKUP_DIR=~/megaweave.backup.$(date +%Y%m%d_%H%M%S)
            cp -r ~/megaweave $BACKUP_DIR
            echo "backup-created=true" >> $GITHUB_OUTPUT
            echo "backup-path=$BACKUP_DIR" >> $GITHUB_OUTPUT
            echo "✅ Backup created at: $BACKUP_DIR"
          else
            echo "backup-created=false" >> $GITHUB_OUTPUT
            echo "⚠️ No existing production directory to backup"
          fi

      - name: Cleanup old backups
        run: |
          cd ~
          # 保留最近 2 個備份，刪除更舊的
          ls -dt megaweave.backup.* 2>/dev/null | tail -n +3 | xargs -r rm -rf
          echo "🧹 Cleaned up old backups (keeping last 2)"

  deploy-server:
    name: Deploy Backend (Docker)
    needs: [detect-changes, create-backup]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.server-changed == 'true')
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop old systemd backend service if exists
        run: |
          if sudo systemctl is-active --quiet megaweave-be.service 2>/dev/null; then
            echo "🛑 Stopping legacy systemd backend service..."
            sudo systemctl stop megaweave-be.service
            sudo systemctl disable megaweave-be.service || true
          fi

      - name: Deploy server container via Docker Compose
        run: |
          # Ensure .env.production exists
          if [ -f server/.env.production ]; then
            echo "✅ server/.env.production found"
          elif [ -f ~/megaweave/server/.env.production ]; then
            cp ~/megaweave/server/.env.production server/.env.production
            echo "✅ Copied .env.production from ~/megaweave/server/"
          else
            echo "⚠️ .env.production not found in repository, checking system env"
            touch server/.env.production
          fi

          echo "🚀 Building and starting Backend container..."
          docker compose up -d --build backend

      - name: Verify backend container
        run: |
          sleep 5
          if [ "$(docker inspect -f '{{.State.Running}}' megaweave-backend 2>/dev/null)" = "true" ]; then
            echo "✅ Backend container is running successfully"
            docker compose ps backend
          else
            echo "❌ Backend container failed to start"
            docker logs megaweave-backend --tail 50
            exit 1
          fi

  deploy-client:
    name: Deploy Frontend (Docker)
    needs: [detect-changes, create-backup]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.client-changed == 'true')
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop old systemd frontend service if exists
        run: |
          if sudo systemctl is-active --quiet megaweave-fe.service 2>/dev/null; then
            echo "🛑 Stopping legacy systemd frontend service..."
            sudo systemctl stop megaweave-fe.service
            sudo systemctl disable megaweave-fe.service || true
          fi

      - name: Deploy client container via Docker Compose
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          # Ensure .env.production exists
          if [ -f client/.env.production ]; then
            echo "✅ client/.env.production found"
          elif [ -f ~/megaweave/client/.env.production ]; then
            cp ~/megaweave/client/.env.production client/.env.production
            echo "✅ Copied .env.production from ~/megaweave/client/"
          else
            echo "⚠️ .env.production not found in repository, checking system env"
            touch client/.env.production
          fi

          echo "🚀 Building and starting Frontend container..."
          docker compose up -d --build frontend

      - name: Verify frontend container
        run: |
          sleep 5
          if [ "$(docker inspect -f '{{.State.Running}}' megaweave-frontend 2>/dev/null)" = "true" ]; then
            echo "✅ Frontend container is running successfully"
            docker compose ps frontend
          else
            echo "❌ Frontend container failed to start"
            docker logs megaweave-frontend --tail 50
            exit 1
          fi

  post-deploy-cleanup:
    name: Post-Deploy Cleanup
    needs: [detect-changes, deploy-server, deploy-client]
    if: always() && needs.detect-changes.outputs.any-changed == 'true'
    runs-on: self-hosted
    steps:
      - name: Clean up workspace & dangling docker images
        run: |
          echo "🧹 清理中間 Docker 鏡像與臨時檔案..."
          docker image prune -f || true
          
          WORK_DIR="${GITHUB_WORKSPACE}"
          if [ -d "$WORK_DIR" ]; then
            rm -rf "$WORK_DIR/server/node_modules" 2>/dev/null || true
            rm -rf "$WORK_DIR/client/node_modules" 2>/dev/null || true
            rm -rf "$WORK_DIR/client/.next" 2>/dev/null || true
          fi

          echo "✅ 清理完成"

      - name: Final disk check
        run: |
          echo "📊 最終磁碟狀態："
          df -h /
          echo ""
          echo "💾 記憶體狀態："
          free -h

  deployment-summary:
    name: Deployment Summary
    needs:
      [
        detect-changes,
        create-backup,
        deploy-server,
        deploy-client,
        post-deploy-cleanup,
      ]
    if: always() && needs.detect-changes.outputs.any-changed == 'true' && !contains(needs.*.result, 'failure')
    runs-on: self-hosted

    steps:
      - name: Print deployment summary
        run: |
          echo "🎯 === DEPLOYMENT SUMMARY ==="
          echo "📅 Time: $(date)"
          echo "🔍 Changes detected:"
          echo "  - Server: ${{ needs.detect-changes.outputs.server-changed }}"
          echo "  - Client: ${{ needs.detect-changes.outputs.client-changed }}"
          echo ""
          echo "📦 Backup:"
          if [ "${{ needs.create-backup.outputs.backup-created }}" == "true" ]; then
            echo "  - ✅ Created: ${{ needs.create-backup.outputs.backup-path }}"
          else
            echo "  - ⚠️ No backup needed (fresh deployment)"
          fi
          echo ""
          echo "🚀 Deployment results:"
          if [ "${{ needs.deploy-server.result }}" != "" ]; then
            echo "  - Backend Container: ${{ needs.deploy-server.result }}"
          else
            echo "  - Backend: skipped (no changes)"
          fi
          if [ "${{ needs.deploy-client.result }}" != "" ]; then
            echo "  - Frontend Container: ${{ needs.deploy-client.result }}"
          else
            echo "  - Frontend: skipped (no changes)"
          fi
          echo ""
          echo "📊 System status:"
          df -h / | tail -1
          echo ""
          echo "🎉 Deployment completed successfully!"

  deployment-failure:
    name: Deployment Failed
    needs: [detect-changes, create-backup, deploy-server, deploy-client, post-deploy-cleanup]
    if: always() && needs.detect-changes.outputs.any-changed == 'true' && contains(needs.*.result, 'failure')
    runs-on: self-hosted

    steps:
      - name: Print failure summary
        run: |
          echo "❌ === DEPLOYMENT FAILED ==="
          echo "📅 Time: $(date)"
          echo "🔍 Changes detected:"
          echo "  - Server: ${{ needs.detect-changes.outputs.server-changed }}"
          echo "  - Client: ${{ needs.detect-changes.outputs.client-changed }}"
          echo ""
          echo "💥 Failed jobs:"
          if [ "${{ needs.deploy-server.result }}" == "failure" ]; then
            echo "  - ❌ Backend container deployment failed"
          fi
          if [ "${{ needs.deploy-client.result }}" == "failure" ]; then
            echo "  - ❌ Frontend container deployment failed"
          fi
          echo ""
          echo "📊 Current system status:"
          df -h /
          free -h
          echo ""
          echo "🔧 Please check the job logs above or run 'docker logs <container_name>' for details"
