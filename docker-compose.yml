services:
  redis:
    container_name: megaweave-redis
    image: redis/redis-stack:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:8001:8001"
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD} --dir /data --dbfilename dump.rdb
    volumes:
      - /var/lib/redis-stack/data:/data
    networks:
      - megaweave-net

  backend:
    container_name: megaweave-backend
    image: ghcr.io/jasonjtw/megaweaving-backend:latest
    ports:
      - "8443:8443"
    env_file:
      - ./server/.env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - megaweave-net

  frontend:
    container_name: megaweave-frontend
    image: ghcr.io/jasonjtw/megaweaving-frontend:latest
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env.production
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - megaweave-net

  workbench:
    container_name: megaweave-workbench
    image: ghcr.io/pontusab/workbench-standalone:latest
    ports:
      - "9999:3000"
    env_file:
      - path: ./workbench.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - megaweave-net

networks:
  megaweave-net:
    driver: bridge
