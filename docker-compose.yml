services:
  # 1. 快取實例：Session, Socket.IO, 防刷冷卻, Trending 排行榜
  redis-cache:
    container_name: megaweave-redis-cache
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --save "" --appendonly no --maxmemory 128mb --maxmemory-policy volatile-lru
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - megaweave-net

  # 2. 隊列實例：BullMQ 佇列任務 (noeviction + AOF 每秒同步)
  redis-queue:
    container_name: megaweave-redis-queue
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --appendfsync everysec --dir /data --maxmemory 128mb --maxmemory-policy noeviction
    restart: unless-stopped
    volumes:
      - /var/lib/redis-queue/data:/data
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - megaweave-net

  # 3. 向量實例：Redis Stack (RediSearch / HNSW Vector Index)
  redis-vector:
    container_name: megaweave-redis-vector
    image: redis/redis-stack:latest
    restart: unless-stopped
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD} --dir /data --dbfilename dump.rdb --maxmemory 384mb --maxmemory-policy noeviction
    volumes:
      - /var/lib/redis-stack/data:/data
    ports:
      - "127.0.0.1:6381:6379"
      - "127.0.0.1:8001:8001"
    networks:
      - megaweave-net

  backend-api:
    container_name: megaweave-backend-api
    image: ghcr.io/jasonjtw/megaweaving-backend:latest
    command: ["node", "dist/server.js"]
    ports:
      - "8443:8443"
    env_file:
      - ./server/.env.production
    environment:
      APP_ROLE: api
      REDIS_CACHE_URL: "redis://:${REDIS_PASSWORD}@redis-cache:6379"
      REDIS_QUEUE_URL: "redis://:${REDIS_PASSWORD}@redis-queue:6379"
      REDIS_VECTOR_URL: "redis://:${REDIS_PASSWORD}@redis-vector:6379"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - redis-cache
      - redis-queue
      - redis-vector
    networks:
      - megaweave-net

  backend-worker:
    container_name: megaweave-backend-worker
    image: ghcr.io/jasonjtw/megaweaving-backend:latest
    command: ["node", "dist/worker.js"]
    env_file:
      - ./server/.env.production
    environment:
      APP_ROLE: worker
      REDIS_CACHE_URL: "redis://:${REDIS_PASSWORD}@redis-cache:6379"
      REDIS_QUEUE_URL: "redis://:${REDIS_PASSWORD}@redis-queue:6379"
      REDIS_VECTOR_URL: "redis://:${REDIS_PASSWORD}@redis-vector:6379"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - redis-cache
      - redis-queue
      - redis-vector
    networks:
      - megaweave-net

  frontend:
    container_name: megaweave-frontend
    image: ghcr.io/jasonjtw/megaweaving-frontend:latest
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env.production
    restart: unless-stopped
    depends_on:
      - backend-api
    networks:
      - megaweave-net

  workbench:
    container_name: megaweave-workbench
    image: ghcr.io/pontusab/workbench-standalone:latest
    ports:
      - "9999:3000"
    env_file:
      - path: ./workbench.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - megaweave-net

networks:
  megaweave-net:
    driver: bridge
