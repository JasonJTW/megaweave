version: '3.8'

services:
  backend:
    container_name: megaweave-backend
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8443:8443"
    env_file:
      - ./server/.env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - megaweave-net

  frontend:
    container_name: megaweave-frontend
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env.production
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - megaweave-net

networks:
  megaweave-net:
    driver: bridge
