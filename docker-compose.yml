services:
  redis:
    container_name: megaweave-redis
    image: redis/redis-stack:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:8001:8001"
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD} --dir /data --dbfilename dump.rdb
    volumes:
      - /var/lib/redis-stack/data:/data
    networks:
      - megaweave-net

  backend-api:
    container_name: megaweave-backend-api
    image: ghcr.io/jasonjtw/megaweaving-backend:latest
    command: ["node", "dist/server.js"]
    ports:
      - "8443:8443"
    env_file:
      - ./server/.env.production
    environment:
      # APP_ROLE tells getDbPoolConfig() to use API_DB_CONNECTION_LIMIT.
      # Set here (not in .env.production) because api and worker share the same env file.
      APP_ROLE: api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - megaweave-net

  backend-worker:
    container_name: megaweave-backend-worker
    image: ghcr.io/jasonjtw/megaweaving-backend:latest
    command: ["node", "dist/worker.js"]
    env_file:
      - ./server/.env.production
    environment:
      # APP_ROLE tells getDbPoolConfig() to use WORKER_DB_CONNECTION_LIMIT.
      # Set here (not in .env.production) because api and worker share the same env file.
      APP_ROLE: worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - megaweave-net

  frontend:
    container_name: megaweave-frontend
    image: ghcr.io/jasonjtw/megaweaving-frontend:latest
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env.production
    restart: unless-stopped
    depends_on:
      - backend-api
    networks:
      - megaweave-net

  workbench:
    container_name: megaweave-workbench
    image: ghcr.io/pontusab/workbench-standalone:latest
    ports:
      - "9999:3000"
    env_file:
      - path: ./workbench.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - megaweave-net

networks:
  megaweave-net:
    driver: bridge
