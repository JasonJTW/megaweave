pre-commit:
  commands:
    # Only client/ is Prettier-formatted (client/.prettierrc); server/ is left to ESLint.
    format-client:
      root: "client/"
      glob: "*.{js,mjs,cjs,ts,mts,cts,tsx,json,md,css}"
      run: npx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    lint-client:
      root: "client/"
      glob: "*.{js,mjs,ts,mts,tsx}"
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    lint-server:
      root: "server/"
      glob: "*.{js,mjs,ts,mts}"
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    typecheck:
      run: make typecheck
    test:
      run: make test

pre-push:
  piped: true # stop at the first failure, in order
  jobs:
    - name: no-push-to-main
      use_stdin: true
      run: |
        if grep -q ' refs/heads/main '; then
          echo "main is protected: push a branch and open a PR (gh pr create --fill)."
          exit 1
        fi
    - name: e2e
      # The E2E stack (docker-compose.e2e.yml) must be up; `make e2e-up` is idempotent.
      run: make e2e-up && make e2e
