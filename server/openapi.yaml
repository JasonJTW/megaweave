      description: Also backfills an empty custom_name with the username.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Current value (absent when there is no profile row)
          content:
            application/json:
              schema:
                type: object
                properties:
                  bio: { type: [string, "null"] }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [profile]
      operationId: setMyBio
      summary: Set the signed-in user's bio
      description: A `user_id`/`userId` in the body that is not the session user's is refused (403).
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bio: { type: [string, "null"] }
                user_id: { type: integer }
                userId: { type: integer }
      responses:
        "200":
          description: Saved. `data` is the raw MySQL result.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
                  data: { description: mysql2 query result }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/userprofile/custom_name:
