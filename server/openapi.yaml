                  properties:
                    member_name: { type: string, minLength: 1 }
                    location: { type: string }
                    email: { type: string }
                    member_bio: { type: string }
                    websites: { type: array, items: { $ref: "#/components/schemas/MemberWebsite" } }
                    title: { type: string }
