        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [profile]
      operationId: setMyCustomName
      summary: Set the signed-in user's display name
      description: A `user_id`/`userId` in the body that is not the session user's is refused (403). A non-empty name also updates every session of the user.
      security: [{ sessionCookie: [] }]
