        id: { type: integer }
        status: { type: string, enum: [requested, approved, completed] }
        createdAt: { type: string, format: date-time }
        quantity: { type: integer }
        receiver:
          type: object
          required: [name]
          properties:
            name: { type: string }
        receiverUnit:
          oneOf:
            - { $ref: "#/components/schemas/OrgUnitRef" }
            - { type: "null" }
    PublicListing:
      type: object
      required: [categoryId, tags, expiresAt, location]
