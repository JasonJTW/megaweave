openapi: 3.1.0
info:
  title: Megaweave API
  version: 1.0.0
  description: |
    HTTP contract of the Express server (`server/src/app.ts`, `server/src/api.ts`).
    `server/src/openapiContract.test.ts` fails when a registered route is missing here
    or a documented operation is no longer registered.

    Conventions:
    - Errors: every 4xx/5xx JSON error has the `ApiError` shape. Error codes live in
      `server/src/utils/errorCodes.ts` and are deliberately not listed per operation.
    - Auth: `sessionCookie` is the session id cookie set by signin/signup. Operations
      without `security` are public; `optionalAuth` operations accept the cookie and
      personalise the response when it is present.
    - `x-dev-only: true` marks operations that only do anything outside production
      (Lalamove sandbox) or are only mounted on an isolated benchmark instance.
    - Row-shaped responses (posts, weaves, messages, org items) mirror MySQL rows and
      allow additional properties; only fields the route code sets explicitly are listed.
servers:
  - url: https://localhost:8443
    description: Local development (`make dev-server`)
tags:
  - name: health
  - name: auth
    description: Signup, signin, signout and the current session
  - name: me
    description: The signed-in user's aggregate page data and settings
  - name: posts
  - name: reference
    description: Categories and condition levels
  - name: profile
    description: User profile fields, avatar and member cards
  - name: stats
  - name: comments
  - name: weaves
    description: Item handover requests between giver and receiver
  - name: notifications
  - name: messages
  - name: lalamove
    description: Delivery quotes, orders, tracking and the Lalamove webhook
  - name: payments
    description: ECPay checkout and callbacks
  - name: admin
    description: Platform admin (role `admin`)
  - name: org-admin
    description: Organisation administration (org admins)
  - name: orgs
    description: Organisation items, tiers and handovers for org members
  - name: benchmark
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: Server is up. Benchmark instances add `benchmarkEnvironment` and `benchmarkMetrics`.
          content:
            application/json:
              schema:
                type: object
                required: [status, uptime, timestamp, ssl]
                properties:
                  status: { type: string, const: OK }
                  uptime: { type: number, description: Process uptime in seconds }
                  timestamp: { type: string, format: date-time }
                  ssl: { type: boolean }
                  benchmarkEnvironment: { type: string, const: isolated }
                  benchmarkMetrics: { type: object, additionalProperties: true }
  /benchmark/feed-caches/reset:
    post:
      tags: [benchmark]
      operationId: resetBenchmarkFeedCaches
      summary: Clear the in-memory feed vector caches
      description: Mounted only when `BENCHMARK_TARGET_MARKER=megaweave-isolated`.
      x-dev-only: true
      responses:
        "200":
          description: Cache sizes after the reset
          content:
            application/json:
              schema:
                type: object
                required: [feedVectorCaches]
                properties:
                  feedVectorCaches: { type: object, additionalProperties: true }
  /api/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: Create a native account and start a session
      description: Rate limited (auth limiter). Sets the session and `user-role` cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string, minLength: 3 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Account created and signed in
          content:
            application/json:
              schema:
                type: object
                required: [message, user]
                properties:
                  message: { type: string }
                  user:
                    type: object
                    description: The submitted user without password and salt. `id` is always 0.
                    properties:
                      id: { type: integer }
                      username: { type: string }
                      email: { type: string }
                      public_id: { type: string, format: uuid }
                      created_at: { type: string, format: date-time }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/signin:
    post:
      tags: [auth]
      operationId: signin
      summary: Sign in with email and password
      description: Rate limited (auth limiter). Sets the session and `user-role` cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/signin/google:
    post:
      tags: [auth]
      operationId: signinGoogle
      summary: Sign in or sign up with a Google ID token
      description: Rate limited (auth limiter). Sets the session and `user-role` cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential: { type: string, description: Google ID token }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/signin/facebook:
    post:
      tags: [auth]
      operationId: signinFacebook
      summary: Sign in or sign up with a Facebook access token
      description: Rate limited (auth limiter). Sets the session and `user-role` cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessToken]
              properties:
                accessToken: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/signout:
    post:
      tags: [auth]
      operationId: signout
      summary: End the session and clear its cookies
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/currentUser:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: The session's user
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Session user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/UserSession" }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/currentUser/update:
    post:
      tags: [auth]
      operationId: updateCurrentUserSession
      summary: Merge fields into the session
      description: Changing `role` or `userId` is refused (403).
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updates]
              properties:
                updates:
                  type: object
                  description: Partial `UserSession`
                  additionalProperties: true
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                type: object
                required: [updatedUser]
                properties:
                  updatedUser: { $ref: "#/components/schemas/UserSession" }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Everything the user page needs in one request
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Profile, stats, own posts, weaves and (contributor/admin) member card
          content:
            application/json:
              schema:
                type: object
                required: [profile, stats, posts, weaves, member]
                properties:
                  profile:
                    type: object
                    required: [bio, custom_name, contact_email, contact_phone]
                    properties:
                      bio: { type: string }
                      custom_name: { type: string }
                      contact_email: { type: [string, "null"] }
                      contact_phone: { type: [string, "null"] }
                  stats: { $ref: "#/components/schemas/UserStats" }
                  posts:
                    type: array
                    items: { $ref: "#/components/schemas/Post" }
                  weaves:
                    type: array
                    items: { $ref: "#/components/schemas/Weave" }
                  member:
                    description: "`members` row; null unless the user is a contributor or admin"
                    oneOf:
                      - { $ref: "#/components/schemas/Member" }
                      - { type: "null" }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/me/locale:
    put:
      tags: [me]
      operationId: updateMyLocale
      summary: Set the account language used for emails
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties:
                locale: { $ref: "#/components/schemas/Locale" }
      responses:
        "200":
          description: Saved locale
          content:
            application/json:
              schema:
                type: object
                required: [locale]
                properties:
                  locale: { $ref: "#/components/schemas/Locale" }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/posts/presigned-urls:
    post:
      tags: [posts]
      operationId: createPostImageUploadUrls
      summary: Presigned S3 staging upload URLs for post images
      description: Each URL is valid for 300 seconds. At most `UPLOAD_IMAGE_LIMIT` (default 5) files.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [filename, contentType]
                    properties:
                      filename: { type: string, minLength: 1 }
                      contentType: { type: string, pattern: "^image/" }
      responses:
        "200":
          description: One URL per file, in request order
          content:
            application/json:
              schema:
                type: object
                required: [urls]
                properties:
                  urls:
                    type: array
                    items:
                      type: object
                      required: [stagingKey, presignedUrl]
                      properties:
                        stagingKey: { type: string }
                        presignedUrl: { type: string, format: uri }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/posts:
    get:
      tags: [posts]
      operationId: listPosts
      summary: Public post list with filters
      description: Internal and Members org posts are excluded (ADR 0003); org posts show the org as publisher (ADR 0004).
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
        - { name: category_id, in: query, schema: { type: string } }
        - { name: location, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - { name: province, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, default: active } }
        - { name: search, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/PostType" } }
      responses:
        "200":
          description: Page of posts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [posts]
      operationId: createPost
      summary: Create a post
      description: |
        Accepts JSON or urlencoded fields; `categoryId`/`conditionLevel`/`lat`/`lng` may be
        numeric strings and `items`/`stagingKeys` JSON-encoded strings. `expires_at` is accepted
        as an alias of `expiresAt`.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePostInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [message, post]
                properties:
                  message: { type: string }
                  post: { $ref: "#/components/schemas/Post" }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/posts/feed:
    get:
      tags: [posts]
      operationId: getFeed
      summary: Unified hybrid recommendation feed
      description: |
        Personalised when the session cookie is present. A non-empty `search` switches to semantic
        search (at most 300 characters). Responds with a `Server-Timing` header.
      security: [{}, { sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/PostType" } }
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string, maxLength: 300 } }
        - { name: location, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - { name: province, in: query, schema: { type: string } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: lng, in: query, schema: { type: number } }
        - { name: radius, in: query, schema: { type: number }, description: Kilometres }
        - { name: mode, in: query, schema: { type: string } }
      responses:
        "200":
          description: Page of ranked posts
          headers:
            Server-Timing: { schema: { type: string } }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PostPage" }
                  - type: object
                    required: [isPersonalized]
                    properties:
                      isPersonalized: { type: boolean }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/posts/history:
    get:
      tags: [posts]
      operationId: getViewedPosts
      summary: Posts the user has viewed
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: Page of viewed posts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/posts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Post `public_id`
        schema: { type: string }
    get:
      tags: [posts]
      operationId: getPost
      summary: Post detail
      description: Counts a view. `id` must be a UUID. Visibility follows the viewer's org tier.
      security: [{}, { sessionCookie: [] }]
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                type: object
                required: [post]
                properties:
                  post: { $ref: "#/components/schemas/Post" }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
    put:
      tags: [posts]
      operationId: updatePost
      summary: Edit a post (owner or admin)
      description: Same field coercions as create; `deletedImageIds` is accepted as an alias of `deleteImageIds`, and `expiresAt` `""` clears the expiry.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePostInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [message, post]
                properties:
                  message: { type: string }
                  post: { $ref: "#/components/schemas/Post" }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [posts]
      operationId: deletePost
      summary: Soft-delete a post (owner or admin)
      security: [{ sessionCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/posts/{id}/embedding:
    post:
      tags: [posts]
      operationId: generatePostEmbedding
      summary: Generate and save a post embedding now (admin)
      security: [{ sessionCookie: [] }]
      x-required-role: admin
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric post id or `public_id`
          schema: { type: string }
      responses:
        "200":
          description: Embedding saved; other fields come from the embedding service
          content:
            application/json:
              schema:
                type: object
                required: [message, postId]
                properties:
                  message: { type: string }
                  postId: { type: integer }
                additionalProperties: true
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/posts/{postId}/like:
    parameters:
      - name: postId
        in: path
        required: true
        description: Post `public_id`
        schema: { type: string }
    get:
      tags: [posts]
      operationId: getLikeStatus
      summary: Whether the user likes the post
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Like state
          content:
            application/json:
              schema:
                type: object
                required: [liked]
                properties:
                  liked: { type: boolean }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
    put:
      tags: [posts]
      operationId: setLike
      summary: Set the like state (idempotent)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [liked]
              properties:
                liked: { type: boolean }
      responses:
        "200":
          description: New like state
          content:
            application/json:
              schema:
                type: object
                required: [liked, likesCount]
                properties:
                  liked: { type: boolean }
                  likesCount: { type: integer }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [posts]
      operationId: toggleLike
      summary: Toggle the like state (legacy; prefer PUT)
      deprecated: true
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: New like state
          content:
            application/json:
              schema:
                type: object
                required: [liked]
                properties:
                  liked: { type: boolean }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/categories:
    get:
      tags: [reference]
      operationId: listCategories
      summary: Active categories
      responses:
        "200":
          description: Categories ordered by id
          content:
            application/json:
              schema:
                type: object
                required: [message, categories]
                properties:
                  message: { type: string }
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/categories/{id}:
    get:
      tags: [reference]
      operationId: getCategory
      summary: One category (any status)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                type: object
                required: [message, category]
                properties:
                  message: { type: string }
                  category: { $ref: "#/components/schemas/Category" }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/conditions:
    get:
      tags: [reference]
      operationId: listConditions
      summary: Active condition levels
      responses:
        "200":
          description: Conditions ordered by level
          content:
            application/json:
              schema:
                type: object
                required: [message, conditions]
                properties:
                  message: { type: string }
                  conditions:
                    type: array
                    items: { $ref: "#/components/schemas/Condition" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/conditions/{level}:
    get:
      tags: [reference]
      operationId: getCondition
      summary: One active condition level
      parameters:
        - { name: level, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 5 } }
      responses:
        "200":
          description: Condition
          content:
            application/json:
              schema:
                type: object
                required: [message, condition]
                properties:
                  message: { type: string }
                  condition: { $ref: "#/components/schemas/Condition" }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/avatar:
    post:
      tags: [profile]
      operationId: uploadAvatar
      summary: Upload a new avatar
      description: Image file up to 10 MB; replaces and deletes the previous avatar.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [message, avatarUrl, avatarKey]
                properties:
                  message: { type: string }
                  avatarUrl: { type: string }
                  avatarKey: { type: string }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [profile]
      operationId: deleteAvatar
      summary: Remove the avatar
      security: [{ sessionCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/userprofile/public/{uuid}:
    get:
      tags: [profile]
      operationId: getPublicProfile
      summary: A user's public profile
      description: Public, so it never carries the account email; `contact_email` and `contact_phone` are the contact details the user chose to publish.
      parameters:
        - { name: uuid, in: path, required: true, description: User `public_id`, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                type: object
                required: [public_id, username, bio]
                properties:
                  public_id: { type: string, format: uuid }
                  username: { type: string, description: custom_name when set, else username }
                  avatar_url: { type: [string, "null"] }
                  avatar_key: { type: [string, "null"] }
                  role: { $ref: "#/components/schemas/UserRole" }
                  created_at: { type: string, format: date-time }
                  bio: { type: string }
                  contact_email: { type: [string, "null"] }
                  contact_phone: { type: [string, "null"] }
        "4XX": { $ref: "#/components/responses/ClientError" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/member/all:
    get:
      tags: [profile]
      operationId: listMembers
      summary: Team member cards for the about page
      parameters:
        - { name: userId, in: query, description: Only this user's card, schema: { type: integer } }
      responses:
        "200":
          description: "`members` rows ordered by sort_order"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "5XX": { $ref: "#/components/responses/ServerError" }
  /api/member:
    post:
      tags: [profile]
      operationId: updateMyMemberCard
      summary: Update the signed-in contributor's or admin's member card
      security: [{ sessionCookie: [] }]
      x-required-role: [admin, contributor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
