      properties:
        categoryId: { type: [integer, "null"] }
        tags: { type: [string, "null"] }
        expiresAt: { type: [string, "null"], format: date-time }
        location:
          oneOf:
            - type: object
              required: [placeId, fullAddress, lat, lng]
              properties:
                placeId: { type: string }
                name: { type: [string, "null"] }
                url: { type: [string, "null"] }
                fullAddress: { type: string }
                province: { type: [string, "null"] }
                city: { type: [string, "null"] }
                route: { type: [string, "null"] }
                zipCode: { type: [string, "null"] }
                lat: { type: number }
                lng: { type: number }
            - { type: "null" }
    PublicListingInput:
      type: object
      required: [categoryId, expiresAt, location]
      properties:
        categoryId: { type: integer, minimum: 1 }
        tags: { type: [string, "null"], maxLength: 500 }
        expiresAt: { type: string, format: date-time, description: Must be in the future }
        location:
          type: object
          required: [place_id, full_address, lat, lng]
          properties:
            place_id: { type: string, minLength: 1, maxLength: 255 }
            full_address: { type: string, minLength: 1, maxLength: 500 }
            lat: { type: number, minimum: -90, maximum: 90 }
            lng: { type: number, minimum: -180, maximum: 180 }
            name: { type: [string, "null"], maxLength: 255 }
            url: { type: [string, "null"], maxLength: 500 }
            province: { type: [string, "null"], maxLength: 100 }
            city: { type: [string, "null"], maxLength: 100 }
            route: { type: [string, "null"], maxLength: 255 }
            zip_code: { type: [string, "null"], maxLength: 20 }
